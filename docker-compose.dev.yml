###################################################################
# 🧠 EIAH_BUILDER — Docker Compose (Ambiente de Desenvolvimento)
# Fases 0–3: Infraestrutura Unificada + Execução Assíncrona + Governança Cognitiva
#
# Revisão de hardening (disciplina uniforme — dev):
# - Secrets fora do YAML: POSTGRES_PASSWORD e REDIS_URL agora vêm do .env da raiz
# - Redis com requirepass (autenticação) + AOF (appendonly) para durabilidade de fila
# - Removidos os inlines REDIS_URL do api e do maintenance-worker (evita override do .env)
#
# Obs: network externa exige pré-criação:
#   docker network create eiah-dev
#
# Variáveis esperadas no .env da raiz (ver PATCH-hardening-dev-*.md):
#   POSTGRES_PASSWORD, REDIS_PASSWORD, REDIS_URL, DATABASE_URL
###################################################################
services:

  #################################################################
  # API — Gateway + Core Multi-Tenant
  #################################################################
  api:
    image: node:20-bookworm
    container_name: eiah-api
    working_dir: /app
    command: >
      sh -c "
        corepack enable &&
        pnpm -C apps/api dev
      "
    env_file:
      - .env
      - ./apps/api/.env
    environment:
      - FRONTEND_URL=${FRONTEND_URL}
      - EIAH_ENVIRONMENT_ID=eiah-dev
      - SERVICE_ROLE=api
      - RUN_QUEUE_CONSUMER_MODE=api-embedded
      - RUN_ATIVO_CONSUMER_MODE=disabled
      # REDIS_URL removido daqui — agora vem do .env (fonte única, com senha)
      - PNPM_HOME=/pnpm
      - PNPM_STORE_DIR=/pnpm/store
      - PATH=/pnpm:$PATH
    volumes:
      - .:/app
      - pnpm-store:/pnpm/store
      # copia apenas o schema, não sobrescreve o client
      - ./packages/db/prisma:/app/packages/db/prisma
      - ./packages/mcp-runner:/app/packages/mcp-runner
    ports:
      - "8080:8080"
    networks: [eiah-dev]
    depends_on:
      eiah-postgres:
        condition: service_healthy
      eiah-redis:
        condition: service_healthy
    healthcheck:
      # Node 20 tem fetch nativo; evita depender de curl dentro da imagem base
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  #################################################################
  # WEB — Frontend + RunViewer SSE
  #################################################################
  web:
    image: node:20-bookworm
    container_name: eiah-web
    working_dir: /app
    command: >
      sh -c "
        corepack enable &&
        pnpm -C apps/web dev --host
      "
    env_file:
      - .env
      - ./apps/web/.env
    environment:
      - PNPM_HOME=/pnpm
      - PNPM_STORE_DIR=/pnpm/store
      - PATH=/pnpm:$PATH
    volumes:
      - .:/app
      - pnpm-store:/pnpm/store
    ports:
      - "5173:5173"
    networks: [eiah-dev]
    depends_on:
      - api
    extra_hosts:
      # Mantido como estava (pode ser redundante na mesma network, mas preserva comportamento)
      - "eiah-api:host-gateway"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  #################################################################
  # ACTION-RUNNER — Executor de Actions com Prisma Tenant-Aware
  #################################################################
  action-runner:
    image: node:20-bookworm
    container_name: eiah-action-runner
    working_dir: /app
    command: >
      sh -c "
        corepack enable &&
        pnpm -C apps/workers/action-runner dev
      "
    env_file:
      - .env
    environment:
      - PNPM_HOME=/pnpm
      - PNPM_STORE_DIR=/pnpm/store
      - PATH=/pnpm:$PATH
    volumes:
      - .:/app
      - pnpm-store:/pnpm/store
      - ./packages/db:/app/packages/db
      - ./packages/mcp-runner:/app/packages/mcp-runner
    networks: [eiah-dev]
    depends_on:
      eiah-postgres:
        condition: service_healthy
      eiah-redis:
        condition: service_healthy
    restart: unless-stopped

  #################################################################
  # MAINTENANCE-WORKER — Housekeeping e Backfill
  #################################################################
  maintenance-worker:
    image: node:20-bookworm
    container_name: eiah-maintenance-worker
    working_dir: /app
    command: >
      sh -c "
        corepack enable &&
        pnpm -C apps/workers/maintenance-worker dev
      "
    env_file:
      - .env
    environment:
      - EIAH_ENVIRONMENT_ID=eiah-dev
      - SERVICE_ROLE=maintenance-worker
      - RUN_QUEUE_CONSUMER_MODE=disabled
      - RUN_ATIVO_CONSUMER_MODE=maintenance
      # REDIS_URL removido daqui — agora vem do .env (fonte única, com senha)
      - PNPM_HOME=/pnpm
      - PNPM_STORE_DIR=/pnpm/store
      - PATH=/pnpm:$PATH
    volumes:
      - .:/app
      - pnpm-store:/pnpm/store
      - ./packages/db:/app/packages/db
      - ./packages/mcp-runner:/app/packages/mcp-runner
    networks: [eiah-dev]
    depends_on:
      eiah-postgres:
        condition: service_healthy
      eiah-redis:
        condition: service_healthy
    restart: unless-stopped

  #################################################################
  # DATABASE — PostgreSQL 16 (com schema unificado @repo/db)
  #################################################################
  eiah-postgres:
    image: pgvector/pgvector:pg16
    container_name: eiah-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      # POSTGRES_PASSWORD saiu daqui — agora vem do .env (env_file acima o injeta)
      POSTGRES_DB: eiah_builder
    ports:
      - "5433:5432" # Evita conflito local
    volumes:
      - eiah_builder_eiah_postgres_data:/var/lib/postgresql/data
    networks: [eiah-dev]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  #################################################################
  # REDIS — Mensageria + Cache + Fila BullMQ
  # requirepass (auth) + AOF (appendonly) — durabilidade de fila run/receipt
  #################################################################
  eiah-redis:
    image: redis:7
    container_name: eiah-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      # redis-cli lê REDISCLI_AUTH automaticamente — evita senha no process list do healthcheck
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - eiah_builder_eiah_redis_data:/data
    networks: [eiah-dev]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

###################################################################
# VOLUMES
###################################################################
volumes:
  pnpm-store:
  eiah_builder_eiah_postgres_data:
  eiah_builder_eiah_redis_data:

###################################################################
# NETWORK
###################################################################
networks:
  eiah-dev:
    external: true
