name: ReleaseNode22Readiness

on:
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.12.4'
  READINESS_RELEASE_VERSION: '0.0.0-readiness'

jobs:
  prepare_readiness:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.out.outputs.release_version }}
    steps:
      - id: out
        run: echo "release_version=${{ env.READINESS_RELEASE_VERSION }}" >> "$GITHUB_OUTPUT"

  detect_readiness:
    runs-on: ubuntu-latest
    needs: prepare_readiness
    outputs:
      has_cli: ${{ steps.out.outputs.has_cli }}
      has_api: ${{ steps.out.outputs.has_api }}
      has_workers: ${{ steps.out.outputs.has_workers }}
    steps:
      - uses: actions/checkout@v4
      - id: out
        shell: bash
        run: |
          test -f apps/cli/package.json && C=true || C=false
          test -f apps/api/Dockerfile.prod && A=true || A=false
          test -f apps/workers/action-runner/Dockerfile.prod && W=true || W=false

          {
            echo "has_cli=$C"
            echo "has_api=$A"
            echo "has_workers=$W"
          } >> "$GITHUB_OUTPUT"

  validate_release_readiness:
    runs-on: ubuntu-latest
    needs: prepare_readiness
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies without postinstall
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build workspace dependencies in release order
        run: |
          pnpm --filter @repo/db build
          pnpm --filter @eiah/core build

      - name: Run lint and build
        run: |
          pnpm lint
          pnpm build

      - name: Validate Prisma schema
        shell: bash
        run: |
          pnpm --filter @repo/db prisma validate --schema packages/db/prisma/schema.prisma
          pnpm --filter @repo/db prisma format --schema packages/db/prisma/schema.prisma --check
          pnpm --filter @repo/db prisma migrate diff \
            --from-schema-datamodel ./packages/db/prisma/schema.prisma \
            --to-schema-datamodel ./packages/db/prisma/schema.prisma
