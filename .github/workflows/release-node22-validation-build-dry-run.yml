name: ReleaseNode22ValidationBuildDryRun

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versao opcional apenas para rastreabilidade do dry-run. Sem publish.'
        required: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.12.4'
  DRY_RUN_RELEASE_VERSION: '0.0.0-validation-build-dry-run'

jobs:
  prepare_dry_run:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.out.outputs.release_version }}
    steps:
      - id: out
        shell: bash
        run: |
          INPUT='${{ github.event.inputs.version }}'
          VER="${INPUT:-${{ env.DRY_RUN_RELEASE_VERSION }}}"
          echo "release_version=$VER" >> "$GITHUB_OUTPUT"

  detect_dry_run:
    runs-on: ubuntu-latest
    needs: prepare_dry_run
    outputs:
      has_cli: ${{ steps.out.outputs.has_cli }}
      has_api: ${{ steps.out.outputs.has_api }}
      has_workers: ${{ steps.out.outputs.has_workers }}
    steps:
      - uses: actions/checkout@v4
      - id: out
        shell: bash
        run: |
          test -f apps/cli/package.json && C=true || C=false
          test -f apps/api/Dockerfile.prod && A=true || A=false
          test -f apps/workers/action-runner/Dockerfile.prod && W=true || W=false

          {
            echo "has_cli=$C"
            echo "has_api=$A"
            echo "has_workers=$W"
          } >> "$GITHUB_OUTPUT"

  validate_release_validation_build_dry_run:
    runs-on: ubuntu-latest
    needs:
      - prepare_dry_run
      - detect_dry_run
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies without postinstall
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build workspace dependencies in release order
        run: |
          pnpm --filter @repo/db build
          pnpm --filter @eiah/core build

      - name: Run lint and build
        run: |
          pnpm lint
          pnpm build

      - name: Validate Prisma schema
        shell: bash
        run: |
          pnpm --filter @repo/db prisma validate --schema ./prisma/schema.prisma
          pnpm --filter @repo/db prisma format --schema ./prisma/schema.prisma --check
          pnpm --filter @repo/db prisma migrate diff \
            --from-schema ./prisma/schema.prisma \
            --to-schema ./prisma/schema.prisma
