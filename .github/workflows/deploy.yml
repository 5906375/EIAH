name: Deploy Monorepo

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de destino'
        type: choice
        options:
          - staging
          - production
        default: staging
        required: true
      version:
        description: 'Tag/versão do artefato a implantar (docker/NPM)'
        required: true
      component:
        description: 'Componente padrão a implantar'
        type: choice
        options:
          - api
          - workers
          - cli
        default: api
        required: true

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.component }} → ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ format('deploy-{0}', github.event.inputs.environment) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR (opcional)
        env:
          REGISTRY_PAT: ${{ secrets.REGISTRY_PAT }}
        run: |
          if [ -z "${REGISTRY_PAT:-}" ]; then
            echo "REGISTRY_PAT ausente; pulando login no GHCR."
            exit 0
          fi
          echo "$REGISTRY_PAT" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Selecionar script de deploy
        env:
          COMPONENT: ${{ github.event.inputs.component }}
          TARGET_ENV: ${{ github.event.inputs.environment }}
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          BULLMQ_REDIS_URL: ${{ secrets.BULLMQ_REDIS_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          set -euo pipefail

          echo "Iniciando deploy do componente $COMPONENT no ambiente $TARGET_ENV com versão $RELEASE_VERSION"

          case "$COMPONENT" in
            api)
              if [ -z "${DATABASE_URL:-}" ]; then
                echo "::error title=DATABASE_URL ausente::Configure DATABASE_URL no environment deploy-$TARGET_ENV"
                exit 1
              fi
              if [ -z "${ADMIN_API_TOKEN:-}" ]; then
                echo "::error title=ADMIN_API_TOKEN ausente::Configure ADMIN_API_TOKEN no environment deploy-$TARGET_ENV"
                exit 1
              fi
              echo "::error title=DEPLOY_NOT_IMPLEMENTED::Rollout real da API ainda não implementado; este workflow é um scaffold. Nenhuma mudança foi aplicada ao ambiente $TARGET_ENV."
              exit 1
              ;;
            workers)
              if [ -z "${DATABASE_URL:-}" ]; then
                echo "::error title=DATABASE_URL ausente::Configure DATABASE_URL no environment deploy-$TARGET_ENV"
                exit 1
              fi
              if [ -z "${BULLMQ_REDIS_URL:-${REDIS_URL:-}}"
              ]; then
                echo "::error title=REDIS/BULLMQ ausente::Configure BULLMQ_REDIS_URL ou REDIS_URL no environment deploy-$TARGET_ENV"
                exit 1
              fi
              echo "::error title=DEPLOY_NOT_IMPLEMENTED::Rollout real dos workers ainda não implementado; este workflow é um scaffold. Nenhuma mudança foi aplicada ao ambiente $TARGET_ENV."
              exit 1
              ;;
            cli)
              echo "::error title=DEPLOY_NOT_IMPLEMENTED::Rollout/distribuição da CLI ainda não implementado; este workflow é um scaffold. Nenhuma mudança foi aplicada ao ambiente $TARGET_ENV."
              exit 1
              ;;
            *)
              echo "::error title=Componente inválido::Valor recebido: $COMPONENT"
              exit 1
              ;;
          esac
