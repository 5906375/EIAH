  p3_economy_hardening:
    name: P3EconomyHardening
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: eiah_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build workspace artifacts
        run: |
          pnpm --filter @eiah/contracts build
          pnpm --filter @repo/db build
          pnpm --filter @eiah/core build
          pnpm --filter @eiah/providers build

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/eiah_ci?schema=public
        run: pnpm --filter @repo/db migrate:deploy

      # NOTA (PR B, docs/ops/ape-audit-telemetry-decision.md Seções 5.1/10.2): a subtest
      # "economy.receipt.v1" de billing.reputation.disputes.contract.test.ts referencia a
      # rota /api/payments/intent, que não existe em apps/api/src/routes/billing.ts (apenas
      # /api/billing/payment-intents, plural). Defeito pré-existente, fora do escopo
      # autorizado deste PR (não altera código de app/rota). Excluído por nome completo,
      # com regex ancorada, contagem esperada e registro explícito no log do job.
      - name: Run P3 economy real test suite
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/eiah_ci?schema=public
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: |
          set -euo pipefail

          readonly P3_EXCLUDED_TEST_NAME='economy.receipt.v1 — webhook settlement grava envelope idempotente no GuardrailLedger'
          readonly P3_SKIP_PATTERN='^economy\.receipt\.v1 — webhook settlement grava envelope idempotente no GuardrailLedger$'
          readonly P3_EXCLUDED_TEST_COUNT=1
          readonly EXPECTED_P3_TESTS=21
          readonly P3_TAP_OUTPUT="$(mktemp)"
          readonly P3_PROBE_21="$(mktemp)"
          readonly P3_PROBE_22="$(mktemp)"
          readonly P3_PROBE_20="$(mktemp)"
          trap 'rm -f -- "$P3_TAP_OUTPUT" "$P3_PROBE_21" "$P3_PROBE_22" "$P3_PROBE_20"' EXIT

          write_p3_tap_probe() {
            local output_file="$1"
            local tests="$2"
            local passed="$3"
            printf '# tests %s\n# pass %s\n# fail 0\n# cancelled 0\n# skipped 0\n# todo 0\n' \
              "$tests" "$passed" > "$output_file"
          }

          verify_p3_tap_summary() {
            local tap_file="$1"
            local label="$2"
            local field expected actual
            local -a matches=()

            while IFS=: read -r field expected; do
              mapfile -t matches < <(sed -n -E "s/^# ${field} ([0-9]+)$/\\1/p" "$tap_file")
              if [ "${#matches[@]}" -ne 1 ]; then
                echo "P3_TAP_SUMMARY_INVALID label=${label} field=${field} occurrences=${#matches[@]}" >&2
                return 1
              fi
              actual="${matches[0]}"
              if [ "$actual" != "$expected" ]; then
                echo "P3_TAP_SUMMARY_MISMATCH label=${label} field=${field} expected=${expected} actual=${actual}" >&2
                return 1
              fi
            done <<EOF
          tests:${EXPECTED_P3_TESTS}
          pass:${EXPECTED_P3_TESTS}
          fail:0
          cancelled:0
          skipped:0
          todo:0
          EOF
          }

          # Exercita o mesmo verificador usado no resultado real: 21 aprova;
          # 22 e 20 precisam ser rejeitados de forma fail-closed.
          write_p3_tap_probe "$P3_PROBE_21" 21 21
          write_p3_tap_probe "$P3_PROBE_22" 22 22
          write_p3_tap_probe "$P3_PROBE_20" 20 20
          verify_p3_tap_summary "$P3_PROBE_21" "synthetic-21"
          if verify_p3_tap_summary "$P3_PROBE_22" "synthetic-22"; then
            echo 'P3_TAP_PROBE_FAILURE synthetic-22 was accepted' >&2
            exit 1
          fi
          if verify_p3_tap_summary "$P3_PROBE_20" "synthetic-20"; then
            echo 'P3_TAP_PROBE_FAILURE synthetic-20 was accepted' >&2
            exit 1
          fi
          echo 'P3_TAP_PROBES_OK accepted=21 rejected=22,20'
          echo "P3_TEST_EXCLUSION count=${P3_EXCLUDED_TEST_COUNT} name=${P3_EXCLUDED_TEST_NAME} reason=pre_existing_missing_route_/api/payments/intent"

          node --import tsx --test --test-force-exit --test-skip-pattern="$P3_SKIP_PATTERN" \
            apps/api/src/tests/billing.economy.contract.test.ts \
            apps/api/src/tests/billing.reputation.disputes.contract.test.ts \
            apps/api/src/tests/billing.reconciliation.contract.test.ts \
            apps/api/src/tests/commission-settlement-e2e.test.ts \
            apps/api/src/tests/realestate.commission.settlement.e2e.test.ts \
            apps/api/src/tests/billing.webhook-signature.test.ts | tee "$P3_TAP_OUTPUT"

          verify_p3_tap_summary "$P3_TAP_OUTPUT" "actual"
          echo 'P3_TEST_SUMMARY_VERIFIED tests=21 pass=21 fail=0 cancelled=0 skipped=0 todo=0 excluded=1'
        timeout-minutes: 5

      - name: Run PR B structural gates anti-regression suite
        run: node --import tsx --test --test-force-exit scripts/tests/apeStructuralGatesAntiRegression.test.ts

      - name: Check P3 economy hardening
        run: pnpm check:p3-economy-hardening

