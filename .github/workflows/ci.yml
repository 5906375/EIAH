name: CI Monorepo

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.12.4'

jobs:
  build_validate:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup pnpm store path
        run: pnpm config set store-dir ~/.pnpm-store

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Enforce lockfile policy
        run: |
          test ! -f package-lock.json || (echo "package-lock.json is forbidden; use pnpm-lock.yaml" && exit 1)
          test ! -f yarn.lock || (echo "yarn.lock is forbidden; use pnpm-lock.yaml" && exit 1)
          test ! -f bun.lockb || (echo "bun.lockb is forbidden; use pnpm-lock.yaml" && exit 1)
          test ! -f bun.lock || (echo "bun.lock is forbidden; use pnpm-lock.yaml" && exit 1)
          EXTRA_PNPM_LOCKFILES=$(find . -path './node_modules' -prune -o -name 'pnpm-lock.yaml' -print | grep -v '^./pnpm-lock.yaml$' || true)
          test -z "$EXTRA_PNPM_LOCKFILES" || (echo "extra pnpm lockfiles are forbidden in workspace packages:" && echo "$EXTRA_PNPM_LOCKFILES" && exit 1)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # 1. Validação de código (Adiciona um passo de Linting)
      - name: Run Lint
        run: pnpm lint # Assumindo que você tem um script 'lint' na raiz

      - name: Prepare workspace artifacts for tests
        run: |
          pnpm --filter @eiah/contracts build
          pnpm --filter @repo/db build
          pnpm --filter @eiah/core build
          pnpm --filter @eiah/providers build

      # apps/workers/action-runner/src/index.test.ts precisa de @repo/db,
      # @eiah/core e @eiah/providers buildados (import de ./index -> deps
      # de apps/api/src/services/* que por sua vez importam
      # apps/api/src/orchestrator/llmExecutor.ts -> @eiah/providers) mas
      # nao de Postgres/Redis reais (getPrismaForTenant e mockado via
      # injecao de dependencia). Por isso vive aqui (apos o build acima),
      # nao em test:ci-unit-suite (Grupo B, explicitamente sem build amplo
      # — ver scripts/unit-tests-manifest.txt).
      #
      # DATABASE_URL dummy: packages/db/src/client.ts inicializa um
      # PrismaClient/pg.Pool no nivel do modulo (import-time), entao o
      # simples "import { getPrismaForTenant } from '@repo/db'" em
      # action-runner/src/index.ts lanca excecao sem DATABASE_URL setado,
      # mesmo com o teste mockando getPrismaForTenant via injecao de
      # dependencia (o mock nao evita a avaliacao do modulo real). Nao ha
      # query real neste teste, entao uma connection string sintaticamente
      # valida sem Postgres real (mesmo padrao ja usado no step "Run Tests"
      # deste job) e suficiente — pg.Pool so conecta de fato na primeira
      # query.
      - name: Run action-runner MCP gate-ordering test
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/eiah_ci?schema=public
        run: pnpm test:action-runner-gates

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/eiah_ci?schema=public
          REDIS_URL: redis://127.0.0.1:6379
          TSX_TSCONFIG_PATH: packages/core/tsconfig.test.json
        run: |
          TEST_FILES="$(find packages/core/src -name '*.test.ts' -type f)"
          if [ -n "$TEST_FILES" ]; then
            echo "$TEST_FILES" | tr '\n' '\0' | xargs -0 node --test --import tsx
          else
            echo "No @eiah/core tests found. Skipping root test step."
          fi

      - name: Check src/dist route parity
        run: pnpm check:src-dist-route-parity

      - name: Check ledger/bundle smoke contracts
        run: pnpm check:ledger-bundle-smoke

      - name: Check RBAC fail-closed anti-regression gate
        run: pnpm check:rbac-fail-closed

      - name: Check Redis fail-closed anti-regression gate
        run: pnpm check:redis-fail-closed

      - name: Check GuardrailLedger anti-noop gate
        run: pnpm check:guardrail-ledger-noop

      - name: Check worker topology ownership
        run: pnpm check:worker-topology

      # 2. Build Hardened e Otimizado (Corrige os problemas de TMPDIR e ESBUILD)
      - name: Build Web Application (Hardened)
        # As variáveis TMPDIR e ESBUILD_TMPDIR forçam o uso de /tmp, 
        # garantindo estabilidade no build para ferramentas como o esbuild.
        env:
          TMPDIR: /tmp
          TMP: /tmp
          TEMP: /tmp
          ESBUILD_TMPDIR: /tmp 
          NODE_ENV: production
        # O filtro garante que apenas 'apps/web' seja construído
        run: pnpm --filter apps/web build

