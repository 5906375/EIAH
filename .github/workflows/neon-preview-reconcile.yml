name: Neon Preview Reconcile

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'observe não remove; delete remove somente órfãos preview/pr-*'
        required: true
        type: choice
        options: [observe, delete]
        default: observe
  schedule:
    - cron: '17 3 * * *'

permissions:
  pull-requests: read

env:
  EVIDENCE_DIR: artifacts/neon-preview-reconcile

jobs:
  reconcile:
    name: NeonPreviewReconcile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate Neon configuration
        id: preflight
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          set -euo pipefail

          READY=true
          BLOCKING_CONDITION=
          if [ -z "${NEON_API_KEY:-}" ]; then
            READY=false
            BLOCKING_CONDITION=neon_api_key_missing
          elif [ -z "${NEON_PROJECT_ID:-}" ]; then
            READY=false
            BLOCKING_CONDITION=neon_project_id_missing
          fi

          {
            echo "ready=$READY"
            echo "blocking_condition=$BLOCKING_CONDITION"
          } >> "$GITHUB_OUTPUT"

          if [ "$READY" != true ]; then
            echo "::error title=Neon reconciliation blocked::$BLOCKING_CONDITION"
          fi

      - name: Reconcile preview branches against open pull requests
        if: steps.preflight.outputs.ready == 'true'
        id: reconcile
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          RECONCILE_MODE: ${{ inputs.mode || 'observe' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          const githubHeaders = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const neonHeaders = {
            Authorization: `Bearer ${process.env.NEON_API_KEY}`,
          };
          const mode = process.env.RECONCILE_MODE;
          if (!['observe', 'delete'].includes(mode)) {
            throw new Error('invalid_reconcile_mode');
          }

          async function fetchJson(url, headers) {
            const response = await fetch(url, { headers });
            if (!response.ok) throw new Error(`http_${response.status}`);
            return response.json();
          }

          async function listOpenPrNumbers() {
            const numbers = [];
            for (let page = 1; ; page += 1) {
              const pulls = await fetchJson(
                `https://api.github.com/repos/${process.env.REPOSITORY}/pulls` +
                  `?state=open&per_page=100&page=${page}`,
                githubHeaders,
              );
              numbers.push(...pulls.map((pull) => pull.number));
              if (pulls.length < 100) return numbers;
            }
          }

          fs.mkdirSync(process.env.EVIDENCE_DIR, { recursive: true });
          const reportPath = `${process.env.EVIDENCE_DIR}/reconcile-evidence.json`;

          try {
            const openPrNumbers = await listOpenPrNumbers();
            const neonBase =
              `https://console.neon.tech/api/v2/projects/` +
              `${encodeURIComponent(process.env.NEON_PROJECT_ID)}/branches`;
            const branchPayload = await fetchJson(`${neonBase}?limit=10000`, neonHeaders);
            const previewBranches = (branchPayload.branches || []).filter((branch) =>
              /^preview\/pr-\d+$/.test(branch.name),
            );
            const openPrSet = new Set(openPrNumbers);
            const orphans = previewBranches.filter((branch) => {
              const prNumber = Number(branch.name.slice('preview/pr-'.length));
              return !openPrSet.has(prNumber);
            });

            const deletedBranches = [];
            const failedBranches = [];
            if (mode === 'delete') {
              for (const branch of orphans) {
                const response = await fetch(
                  `${neonBase}/${encodeURIComponent(branch.id)}`,
                  { method: 'DELETE', headers: neonHeaders },
                );
                if (response.status === 200 || response.status === 204) {
                  deletedBranches.push(branch.name);
                } else {
                  failedBranches.push({
                    branchName: branch.name,
                    httpStatus: response.status,
                  });
                }
              }
            } else if (orphans.length > 0) {
              console.warn(
                `::warning title=Neon preview orphans observed::${orphans.length} branch(es) marked; no deletion attempted`,
              );
            }

            const report = {
              status: failedBranches.length === 0 ? 'success' : 'failed',
              timestamp: new Date().toISOString(),
              mode,
              branchPrefix: 'preview/pr-',
              openPrCount: openPrNumbers.length,
              openPrNumbers,
              previewBranchCount: previewBranches.length,
              checkedBranches: previewBranches.map((branch) => branch.name),
              orphanBranchCount: orphans.length,
              orphanBranches: orphans.map((branch) => branch.name),
              deletedBranches,
              failedBranches,
              blockingCondition:
                failedBranches.length === 0 ? null : 'orphan_preview_branch_delete_failed',
            };
            fs.writeFileSync(reportPath, `${JSON.stringify(report, null, 2)}\n`);
            if (failedBranches.length > 0) process.exitCode = 1;
          } catch (error) {
            const report = {
              status: 'failed',
              timestamp: new Date().toISOString(),
              mode,
              branchPrefix: 'preview/pr-',
              openPrCount: null,
              openPrNumbers: [],
              previewBranchCount: null,
              checkedBranches: [],
              orphanBranchCount: null,
              orphanBranches: [],
              deletedBranches: [],
              failedBranches: [],
              blockingCondition: 'neon_preview_reconciliation_request_failed',
            };
            fs.writeFileSync(reportPath, `${JSON.stringify(report, null, 2)}\n`);
            console.error(`::error title=Neon reconciliation request failed::${error.message}`);
            process.exitCode = 1;
          }
          EOF

      - name: Build preflight failure evidence
        if: always()
        env:
          PREFLIGHT_READY: ${{ steps.preflight.outputs.ready }}
          PREFLIGHT_BLOCK: ${{ steps.preflight.outputs.blocking_condition }}
          RECONCILE_MODE: ${{ inputs.mode || 'observe' }}
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const path = `${process.env.EVIDENCE_DIR}/reconcile-evidence.json`;
          if (!fs.existsSync(path)) {
            fs.mkdirSync(process.env.EVIDENCE_DIR, { recursive: true });
            const report = {
              status: 'blocked',
              timestamp: new Date().toISOString(),
              mode: process.env.RECONCILE_MODE,
              branchPrefix: 'preview/pr-',
              openPrCount: null,
              openPrNumbers: [],
              previewBranchCount: null,
              checkedBranches: [],
              orphanBranchCount: null,
              orphanBranches: [],
              deletedBranches: [],
              failedBranches: [],
              blockingCondition:
                process.env.PREFLIGHT_BLOCK || 'neon_preview_reconciliation_not_executed',
            };
            fs.writeFileSync(path, `${JSON.stringify(report, null, 2)}\n`);
          }
          EOF

      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neon-preview-reconcile-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/reconcile-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce reconciliation result and emit alert
        if: always()
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const report = JSON.parse(
            fs.readFileSync(`${process.env.EVIDENCE_DIR}/reconcile-evidence.json`, 'utf8'),
          );
          if (report.status !== 'success') {
            console.error(
              `::error title=Neon preview reconciliation failed::${report.blockingCondition}`,
            );
            process.exit(1);
          }
          EOF
