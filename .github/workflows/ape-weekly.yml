name: APE Weekly Cycle

on:
  workflow_dispatch:
    inputs:
      rollout_mode:
        description: "shadow|enforce"
        required: false
        type: choice
        options: [shadow, enforce]
        default: shadow
      canary_stage:
        description: "pilot|small|general"
        required: false
        type: choice
        options: [pilot, small, general]
        default: pilot
      break_glass_enabled:
        description: "Break-glass"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 11 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  ape_weekly_cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: LLM pricing snapshot
        run: node scripts/ci/llm_provider_pricing_snapshot.cjs

      - name: Infra pricing snapshot
        run: node scripts/ci/infra_provider_pricing_snapshot.cjs

      - name: Generate P3 economy evidence
        run: pnpm generate:p3-economy-evidence

      - name: Generate SLO baseline
        run: pnpm generate:slo-baseline

      - name: Check SLO targets
        run: pnpm check:slo-target

      - name: Run APE cycle
        env:
          APE_ROLLOUT_MODE: ${{ github.event.inputs.rollout_mode || 'shadow' }}
          APE_CANARY_STAGE: ${{ github.event.inputs.canary_stage || 'pilot' }}
        run: pnpm ape:cycle:weekly

      - name: Evidence linkage
        run: pnpm check:ape-evidence-linkage

      - name: Hard metrics
        run: pnpm check:ape-hard-metrics

      - name: Provider pricing recency
        run: pnpm check:provider-pricing-recency

      - name: Evidence index
        run: pnpm check:evidence-index

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ape-weekly-artifacts
          path: |
            artifacts/ape/provider-pricing-snapshot.json
            artifacts/ape/infra-provider-pricing-snapshot.json
            artifacts/ape/weekly-cycle-payload.json
            artifacts/ape/weekly-cycle-response.json
            artifacts/ape/weekly-cycle-decision.json
            artifacts/ape/weekly-report.md

      - name: Create PR with renewed APE evidence
        id: create-evidence-pr
        uses: peter-evans/create-pull-request@v7
        with:
          # Branch fixa (ratificado D23): evita acumulo de PRs stale como
          # bot/ape-weekly-evidence-28380235280 (N-20) — a action atualiza a
          # mesma branch/PR a cada run em vez de criar uma nova por run_id.
          branch: bot/ape-weekly-evidence
          commit-message: "docs(ops): renew weekly APE evidence window"
          title: "docs(ops): renew weekly APE evidence window"
          body: |
            Renovação automática da janela semanal de evidência APE.

            Arquivos atualizados:
            - `ops/evidence/latest/ape-weekly-cycle-run*.md`
            - `docs/EVIDENCE_INDEX.md`
          delete-branch: true

      # Auto-merge (ratificado D23): so roda quando a PR foi de fato criada
      # (peter-evans nao cria PR se nao ha diff). Estritamente condicionado a
      # (a) diff restrito a ops/evidence/latest/** e docs/EVIDENCE_INDEX.md —
      # qualquer outro path falha o step com mensagem clara, sem habilitar
      # auto-merge; (b) o proprio step "Evidence index" (linha acima) ja
      # bloqueia o job antes de chegar aqui se check:evidence-index falhar —
      # revalidado explicitamente de novo abaixo por seguranca em camadas.
      # Auto-merge nativo do GitHub (gh pr merge --auto) so completa o merge
      # depois que os required status checks da branch protection passarem —
      # nao contorna branch protection. Ver
      # ops/evidence/latest/ape-weekly-automerge-decision-2026-07-08.md.
      - name: Guard evidence-only diff and enable auto-merge
        if: steps.create-evidence-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create-evidence-pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail

          CHANGED_FILES="$(gh pr diff "$PR_NUMBER" --name-only)"
          echo "Changed files in PR #$PR_NUMBER:"
          echo "$CHANGED_FILES"

          OUT_OF_SCOPE="$(echo "$CHANGED_FILES" | grep -v -E '^(ops/evidence/latest/|docs/EVIDENCE_INDEX\.md$)' || true)"
          if [ -n "$OUT_OF_SCOPE" ]; then
            echo "::error::PR #$PR_NUMBER touches paths outside ops/evidence/latest/** and docs/EVIDENCE_INDEX.md — refusing to enable auto-merge:"
            echo "$OUT_OF_SCOPE"
            exit 1
          fi

          pnpm check:evidence-index

          gh pr merge "$PR_NUMBER" --auto --squash
