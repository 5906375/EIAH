# P0 kill-switch: schedule and auto-merge disabled while the APE generator
# hardcodes audit metrics. See https://github.com/5906375/EIAH/issues/396.
# Manual dispatch may open an evidence PR, but human ratification is required.
name: APE Weekly Cycle

on:
  workflow_dispatch:
    inputs:
      rollout_mode:
        description: "shadow|enforce"
        required: false
        type: choice
        options: [shadow, enforce]
        default: shadow
      canary_stage:
        description: "pilot|small|general"
        required: false
        type: choice
        options: [pilot, small, general]
        default: pilot
      break_glass_enabled:
        description: "Break-glass"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  ape_weekly_cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: LLM pricing snapshot
        run: node scripts/ci/llm_provider_pricing_snapshot.cjs

      - name: Infra pricing snapshot
        run: node scripts/ci/infra_provider_pricing_snapshot.cjs

      - name: Generate P3 economy evidence
        run: pnpm generate:p3-economy-evidence

      - name: Generate SLO baseline
        run: pnpm generate:slo-baseline

      - name: Check SLO targets
        run: pnpm check:slo-target

      - name: Run APE cycle
        id: run_ape_cycle
        env:
          APE_ROLLOUT_MODE: ${{ github.event.inputs.rollout_mode || 'shadow' }}
          APE_CANARY_STAGE: ${{ github.event.inputs.canary_stage || 'pilot' }}
        run: pnpm ape:cycle:weekly

      # N-24 (2026-07-09): com a ordem sequencial anterior, qualquer check
      # abaixo que falhasse (P3/P4, e ja antes deles Hard metrics — ambos
      # avaliam hardMetricsGo/recorrencia e podem legitimamente falhar num
      # ciclo NO_GO) derrubava o job e pulava TODOS os steps seguintes,
      # incluindo Evidence index/Upload artifacts/Create PR — a evidencia do
      # ciclo era gerada localmente mas nunca publicada. Um ciclo NO_GO e
      # justamente o que mais precisa ficar registrado.
      #
      # Fix: cada step abaixo roda de forma independente
      # (`!cancelled() && steps.run_ape_cycle.outcome == 'success'`) — so e
      # pulado se a propria geracao do ciclo falhou (evidencia nunca
      # existiu) ou se o job foi cancelado; nao e mais pulado so porque um
      # check anterior falhou. Cada check continua falhando por si mesmo
      # quando NO_GO — o job final continua vermelho (D25 intacta) — mas a
      # publicacao (Evidence index, Upload artifacts, Create PR) sempre
      # roda quando ha evidencia real para publicar. Ver
      # ops/evidence/latest/ape-weekly-reorder-n24-2026-07-09.md.
      - name: Check P3 recurring stability (relocated from ci.yml, ratified D25)
        if: ${{ !cancelled() && steps.run_ape_cycle.outcome == 'success' }}
        run: pnpm check:p3-stability-recurring

      # PR B (docs/ops/ape-audit-telemetry-decision.md Seções 5.1/10.2, 2026-08-21):
      # step "Check P4 Track P rollout readiness" removido daqui e MOVIDO (não duplicado)
      # para o job p4_trackp_rollout em .github/workflows/ci.yml. Antes: o step só rodava
      # quando steps.run_ape_cycle.outcome == 'success'; depois, o checker interpretava
      # hardMetricsGo declarativo. Agora: gate estrutural real (rotas IMOB + suíte de testes
      # reais), rodando em push/pull_request e independente desses dois acoplamentos.

      - name: Evidence linkage
        if: ${{ !cancelled() && steps.run_ape_cycle.outcome == 'success' }}
        run: pnpm check:ape-evidence-linkage

      - name: Hard metrics
        if: ${{ !cancelled() && steps.run_ape_cycle.outcome == 'success' }}
        run: pnpm check:ape-hard-metrics

      - name: Provider pricing recency
        if: ${{ !cancelled() && steps.run_ape_cycle.outcome == 'success' }}
        run: pnpm check:provider-pricing-recency

      - name: Evidence index
        if: ${{ !cancelled() && steps.run_ape_cycle.outcome == 'success' }}
        run: pnpm check:evidence-index

      - name: Upload artifacts
        if: ${{ !cancelled() && steps.run_ape_cycle.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ape-weekly-artifacts
          path: |
            artifacts/ape/provider-pricing-snapshot.json
            artifacts/ape/infra-provider-pricing-snapshot.json
            artifacts/ape/weekly-cycle-payload.json
            artifacts/ape/weekly-cycle-response.json
            artifacts/ape/weekly-cycle-decision.json
            artifacts/ape/weekly-report.md

      - name: Create PR with renewed APE evidence
        id: create-evidence-pr
        if: ${{ !cancelled() && steps.run_ape_cycle.outcome == 'success' }}
        uses: peter-evans/create-pull-request@v7
        with:
          # Branch fixa (ratificado D23): evita acumulo de PRs stale como
          # bot/ape-weekly-evidence-28380235280 (N-20) — a action atualiza a
          # mesma branch/PR a cada run em vez de criar uma nova por run_id.
          branch: bot/ape-weekly-evidence
          commit-message: "docs(ops): renew weekly APE evidence window"
          title: "docs(ops): renew weekly APE evidence window"
          body: |
            Renovação automática da janela semanal de evidência APE.

            Arquivos atualizados:
            - `ops/evidence/latest/ape-weekly-cycle-run*.md`
            - `docs/EVIDENCE_INDEX.md`
          delete-branch: true
