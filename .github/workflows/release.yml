name: Release Monorepo

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (sem "v") para publicar. Deixe vazio para usar o nome da tag.'
        required: false
  push:
    tags:
      - "v*"
      - "release/v*"

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  REGISTRY: ghcr.io

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.v.outputs.release_version }}
    steps:
      - id: v
        run: |
          INPUT='${{ github.event.inputs.version }}'
          REF="${GITHUB_REF##*/}"
          VER="${INPUT:-${REF#v}}"
          [ -z "$VER" ] && { echo "sem versão" >&2; exit 1; }
          echo "release_version=$VER" >> "$GITHUB_OUTPUT"

  detect:
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      has_cli: ${{ steps.out.outputs.has_cli }}
      has_api: ${{ steps.out.outputs.has_api }}
      has_workers: ${{ steps.out.outputs.has_workers }}
    steps:
      - uses: actions/checkout@v4
      - id: out
        shell: bash
        run: |
          test -f apps/cli/package.json && C=true || C=false
          test -f apps/api/Dockerfile.prod && A=true || A=false
          test -f apps/workers/action-runner/Dockerfile.prod && W=true || W=false

          {
            echo "has_cli=$C"
            echo "has_api=$A"
            echo "has_workers=$W"
          } >> "$GITHUB_OUTPUT"

  validate_release:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint and smoke
        run: |
          pnpm lint
          pnpm build

      - name: Validate Prisma schema
        shell: bash
        run: |
          pnpm --filter @repo/db prisma validate --schema packages/db/prisma/schema.prisma
          pnpm --filter @repo/db prisma format --schema packages/db/prisma/schema.prisma --check
          pnpm --filter @repo/db prisma migrate diff \
          --from-schema-datamodel ./packages/db/prisma/schema.prisma \
          --to-schema-datamodel ./packages/db/prisma/schema.prisma

  release_promotion_telemetry:
    name: ReleasePromotionTelemetry
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Block publication until APE telemetry v3 is available
        shell: bash
        env:
          REASON_CODE: APE_TELEMETRY_NOT_AVAILABLE
        run: |
          printf '{"ok":false,"gate":"ReleasePromotionTelemetry","reasonCode":"%s"}\n' "$REASON_CODE"
          echo "::error title=Release promotion blocked::${REASON_CODE}: valid APE weekly-cycle v3 telemetry is unavailable; publication remains fail-closed."
          exit 1

  publish_cli:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - detect
      - validate_release
      - release_promotion_telemetry
    if: ${{ needs.detect.outputs.has_cli == 'true' }}
    environment:
      name: release-cli
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"

      - name: Install CLI dependencies
        run: pnpm install --filter ./apps/cli...

      - name: Build CLI
        run: pnpm --filter ./apps/cli... run build

      - name: Publish CLI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          pnpm --filter ./apps/cli... pkg set version="$RELEASE_VERSION"
          pnpm --filter ./apps/cli... publish --access public --no-git-checks

  publish_api_image:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - detect
      - validate_release
      - release_promotion_telemetry
    if: ${{ needs.detect.outputs.has_api == 'true' }}
    permissions:
      contents: read
      packages: write
    environment:
      name: release-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_PAT }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/eiah-api:${{ needs.prepare.outputs.release_version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/eiah-api:latest

  publish_worker_image:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - detect
      - validate_release
      - release_promotion_telemetry
    if: ${{ needs.detect.outputs.has_workers == 'true' }}
    permissions:
      contents: read
      packages: write
    environment:
      name: release-workers
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_PAT }}

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/workers/action-runner/Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/eiah-workers:${{ needs.prepare.outputs.release_version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/eiah-workers:latest

