name: Lint

on:
  pull_request:
    branches: [main, dev]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.12.4'
  RUN_DB_SMOKE: '0'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run lint
        run: pnpm lint

      - name: Generate Prisma client for @repo/db tests
        run: pnpm --filter @repo/db generate

      - name: Run @repo/db smoke tests
        run: |
          if [ "${RUN_DB_SMOKE}" != "1" ]; then
            echo "Skipping @repo/db smoke tests (RUN_DB_SMOKE!=1)."
            exit 0
          fi
          DB_TEST_FILES="$(find packages/db/src -name '*.test.ts' -type f)"
          if [ -n "$DB_TEST_FILES" ]; then
            echo "$DB_TEST_FILES" | tr '\n' '\0' | xargs -0 node --test --import tsx
          else
            echo "No @repo/db tests found. Skipping db smoke tests."
          fi
